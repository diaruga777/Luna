  200 for another otherwise-identical one — DuckDuckGo does not commit to a
  status code for it, so the parser must recognize the PAGE, not just the
  202. It has zero `result__a` anchors (both shapes), so the old code's bare
  2xx guard parsed this to an empty "successful" result rather than refusing
  it as the anomaly it is.
-->
