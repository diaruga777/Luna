# Cloudflare Pages project for the Luna site (see site/README.md).
#
# The site is pure static output — no Worker, no build step on Cloudflare's
# side. `site/dist` is generated by `scripts/build_site.py` and committed, so
# `npx wrangler pages deploy` needs nothing but this file.
name = "luna-site"
pages_build_output_dir = "site/dist"
compatibility_date = "2026-08-08"
